<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mac's Australia Adventure 2027</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mac's Aus 27">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#ffffff;--card:#ffffff;--ink:#14202b;--muted:#6b7280;--line:#e6e8eb;--ochre:#0c447c;--euc:#185fa5;--sky:#185fa5;--warn:#b7791f;--r:14px;--soft:#f4f6f8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 14px) 18px 10px;border-bottom:1px solid var(--line)}
h1{margin:0;font:700 21px/1.15 -apple-system,system-ui;letter-spacing:-.3px}
h1 span{color:inherit}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px;font-size:14px;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{padding:14px 14px calc(90px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:21px;font-weight:400;line-height:1}
nav button.on{color:var(--ochre);font-weight:600}
.hero{background:#0c447c;color:#fff;border-radius:var(--r);padding:20px 18px;margin-bottom:16px}
.hero .big{font:800 52px/1 -apple-system,system-ui;letter-spacing:-1.5px}
.hero .sub{opacity:.92;margin-top:4px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:22px 4px 8px;font-weight:600}
.day{font-size:15px;font-weight:700;margin:22px 4px 8px;display:flex;justify-content:space-between;align-items:baseline}
.day small{font-weight:500;color:var(--muted);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);box-shadow:0 1px 2px rgba(20,32,43,.04);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.item{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none;background:var(--soft)}
.body{flex:1;min-width:0}
.t{font-weight:600;line-height:1.25}
.meta{font-size:13px;color:var(--muted);margin-top:2px}
.st{font-size:15px;flex:none}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--soft);color:#4b5563;margin:4px 4px 0 0}
.tag.approx{background:#fff3d6;color:#8a5a00}
.more{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px}
.open .more{display:block}
.more p{margin:0 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;font-size:13px;color:var(--ink);text-decoration:none}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.look{background:var(--soft);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px}
.look b{display:block}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.stat{display:flex;gap:8px}
.stat .card{flex:1;text-align:center;padding:12px 6px;cursor:pointer}
.stat .n{font:800 26px/1 -apple-system,system-ui}
.stat .l{font-size:12px;color:var(--muted);margin-top:4px}
.dl{display:flex;justify-content:space-between;gap:10px;align-items:center}
.cost-head{display:flex;justify-content:space-between;align-items:center;font-weight:600;cursor:pointer}
.cost-head .amt{font:700 20px -apple-system,system-ui}
.cost-lines{display:none;margin-top:8px;font-size:14px}
.open .cost-lines{display:block}
.cost-lines div{display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--line)}
input{font-size:17px;padding:11px 13px;border-radius:12px;border:1px solid var(--line);width:100%;background:#fff}
.legend{font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin:4px 4px 0}
</style>
</head>
<body>
<header>
  <h1>Mac's <span>Australia</span> Adventure 2027</h1>
  <div class="chips" id="chips"></div>
</header>
<main id="main"></main>
<nav id="nav"></nav>

<script>
/*DATA*/
const COSTS_BLOB = /*COSTS*/;
</script>
<script>
const ICON = {flight:"✈️",stay:"🛏️",drive:"🚗",car:"🔑",activity:"🎟️",ferry:"⛴️"};
const STATUS = {booked:["✅","Booked"],details:["❓","Booked – details needed"],tobook:["⚠️","Still to book"],idea:["💡","Idea"]};
const ls = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
let who = ls.get("who") || "all";
let tab = ls.get("tab") || "today";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------- time helpers ----------
const gmt = tz => { if(!tz) return ""; let [h,m] = tz.slice(1).split(":"); h = String(+h); return "GMT" + (tz[0]) + h + (m !== "00" ? ":" + m : ""); };
const at = (d,t,tz) => new Date(`${d}T${t||"12:00"}:00${tz||"+00:00"}`);
const fmtDay = d => new Date(d+"T12:00:00Z").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"});
const nights = (a,b) => Math.round((new Date(b) - new Date(a))/864e5);
const lt = (t,tz) => `${t} local (${gmt(tz)})`;

const items = () => TRIP.items.filter(i => who === "all" || i.who.includes(who))
  .sort((a,b) => sk(a).localeCompare(sk(b)));
const sk = i => i.date + (i.depTime || i.time || (i.type==="stay" ? "23:00" : i.type==="car" ? "08:00" : "12:00"));

// ---------- calendar (.ics) ----------
const icsDT = d => d.toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
const icsD = d => d.replace(/-/g,"");
function ics(title, opts){
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//MacsAus27//EN","BEGIN:VEVENT",
    "UID:"+Math.random().toString(36).slice(2)+"@macsaus27","DTSTAMP:"+icsDT(new Date())];
  if(opts.allDay){ L.push("DTSTART;VALUE=DATE:"+icsD(opts.start), "DTEND;VALUE=DATE:"+icsD(opts.end||opts.start)); }
  else { L.push("DTSTART:"+icsDT(opts.start), "DTEND:"+icsDT(opts.end)); }
  L.push("SUMMARY:"+title.replace(/[,;]/g,"\\$&"));
  if(opts.loc) L.push("LOCATION:"+opts.loc.replace(/[,;]/g,"\\$&"));
  if(opts.desc) L.push("DESCRIPTION:"+opts.desc.replace(/[,;]/g,"\\$&").replace(/\n/g,"\\n"));
  L.push("END:VEVENT","END:VCALENDAR");
  return "data:text/calendar;charset=utf-8," + encodeURIComponent(L.join("\r\n"));
}
const addDay = d => { const x = new Date(d+"T12:00:00Z"); x.setUTCDate(x.getUTCDate()+1); return x.toISOString().slice(0,10); };
function calLink(i){
  const name = "🇦🇺 " + i.title;
  const desc = [i.held && ("Booked: "+i.held), i.notes].filter(Boolean).join("\n");
  if(i.type === "stay") return ics(name, {allDay:true, start:i.date, end:i.endDate||addDay(i.date), loc:i.place, desc});
  if(i.type === "flight" && i.depTime){
    const s = at(i.date === i.arrDate || !i.arrDate ? (i.depDate||i.date) : i.date, i.depTime, i.depTz);
    let e = i.arrTime ? at(i.arrDate||i.date, i.arrTime, i.arrTz) : at(i.date, i.time, i.tz);
    let start = s; if(e < start){ start = at(prevDay(i.date), i.depTime, i.depTz); }
    return ics(name, {start, end:e, loc:i.place, desc});
  }
  if(i.time) { const s = at(i.date,i.time,i.tz); return ics(name,{start:s,end:new Date(+s+36e5),loc:i.place,desc}); }
  return ics(name, {allDay:true, start:i.date, end:addDay(i.date), loc:i.place, desc});
}
const prevDay = d => { const x = new Date(d+"T12:00:00Z"); x.setUTCDate(x.getUTCDate()-1); return x.toISOString().slice(0,10); };

// ---------- rendering ----------
function timeLine(i){
  if(i.type === "flight" && i.depTime && i.arrTime) return `Departs ${lt(i.depTime,i.depTz)} → lands ${i.arrPlace} ${lt(i.arrTime,i.arrTz)}, ${fmtDay(i.arrDate)}`;
  if(i.type === "flight" && i.depTime) return `Departs ${i.depPlace} ${lt(i.depTime,i.depTz)} → lands ${lt(i.time,i.tz)}`;
  if(i.type === "stay") return `${fmtDay(i.date)} → ${fmtDay(i.endDate)} · ${nights(i.date,i.endDate)} night${nights(i.date,i.endDate)>1?"s":""}${i.checkIn?` · in ${i.checkIn} / out ${i.checkOut} (${gmt(i.tz)})`:""}`;
  if(i.type === "drive") return `${i.km ? i.km+" km · " : ""}${i.hrs||""}${i.stops?.length ? " · via "+i.stops.join(", ") : ""}`;
  if(i.time) return lt(i.time, i.tz);
  return "Time TBC";
}
function card(i){
  const [sIc, sTxt] = STATUS[i.status];
  const maps = i.place ? `<a class="btn" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(i.place)}">📍 Map</a>` : "";
  const dir = i.type==="drive" ? `<a class="btn" target="_blank" href="https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(i.title.split(" → ")[0]+", Australia")}&destination=${encodeURIComponent(i.title.split(" → ").pop()+", Australia")}&travelmode=driving">🧭 Route</a>` : "";
  const cal = `<a class="btn" href="${calLink(i)}" download="${i.id}.ics">📅 Add to Calendar</a>`;
  const ppl = i.who.map(w => TRIP.people[w]).join(", ");
  const dl = [i.paid && `💷 <b>Paid</b>`, i.payNote && `💷 ${esc(i.payNote)}`, i.pay && `💷 Pay by <b>${fmtDay(i.pay)}</b>`, i.cancel && `↩️ Free cancel until <b>${fmtDay(i.cancel)}</b>`, i.amend && `✏️ Free changes until <b>${fmtDay(i.amend)}</b>`].filter(Boolean).join("<br>");
  const dlCal = [i.pay && `<a class="btn" href="${ics("💷 Pay: "+i.title,{allDay:true,start:i.pay,end:addDay(i.pay)})}" download="pay-${i.id}.ics">📅 Pay date</a>`,
                 i.cancel && `<a class="btn" href="${ics("↩️ Last day to cancel: "+i.title,{allDay:true,start:i.cancel,end:addDay(i.cancel)})}" download="cancel-${i.id}.ics">📅 Cancel date</a>`,
                 i.amend && `<a class="btn" href="${ics("✏️ Last day for free changes: "+i.title,{allDay:true,start:i.amend,end:addDay(i.amend)})}" download="amend-${i.id}.ics">📅 Change date</a>`].filter(Boolean).join("");
  return `<div class="card item-wrap" onclick="this.classList.toggle('open')">
    <div class="item">
      <div class="ic ${i.type}">${ICON[i.type]}</div>
      <div class="body">
        <div class="t">${esc(i.title)}</div>
        <div class="meta">${esc(timeLine(i))}</div>
        ${i.held ? `<div class="meta">📱 ${esc(i.held)}</div>` : (["booked","details"].includes(i.status) ? `<div class="meta">📱 Whose phone? – tell Ryan</div>` : "")}
        <div>${i.approx?'<span class="tag approx">dates TBC</span>':""}<span class="tag">${esc(ppl)}</span></div>
      </div>
      <div class="st" title="${sTxt}">${sIc}</div>
    </div>
    <div class="more" onclick="event.stopPropagation()">
      <p><b>${sIc} ${sTxt}</b></p>
      ${dl ? `<p>${dl}</p>` : (i.type==="stay" && i.status!=="idea" ? `<p class="meta">💷 Payment date / ↩️ cancellation date – not added yet</p>` : "")}
      ${i.notes ? `<p>${esc(i.notes)}</p>` : ""}
      ${(i.lookup||[]).map(([w,where]) => `<div class="look"><b>🔎 ${esc(w)}</b>Look up on: ${esc(where)}</div>`).join("")}
      <div class="row">${maps}${dir}${cal}${dlCal}</div>
    </div>
  </div>`;
}

function today(){
  const list = items(), now = new Date();
  const first = list[0], last = list[list.length-1];
  if(!first) return `<div class="empty">Nothing tagged for ${TRIP.people[who]} yet.<br>Tell Ryan which bits they're joining.</div>`;
  let h = "";
  const start = at(first.date, first.time, first.tz), end = at(last.endDate||last.date, "23:59", last.tz);
  const nm = who==="all" ? "the adventure" : TRIP.people[who]+"'s trip";
  if(now < start){
    const d = Math.ceil((start - now)/864e5);
    h += `<div class="hero"><div class="big">${d}</div><div class="sub">days until ${nm} starts · ${fmtDay(first.date)}</div></div>`;
    h += `<h2>First up</h2>` + list.slice(0,3).map(card).join("");
  } else if(now <= end){
    const tdy = now.toLocaleDateString("en-CA",{timeZone:"Australia/Sydney"});
    const tonight = list.find(i => i.type==="stay" && i.date<=tdy && i.endDate>tdy);
    h += `<div class="hero"><div class="big" style="font-size:30px">${fmtDay(tdy)}</div><div class="sub">${tonight?"Tonight: "+esc(tonight.title):"No stay set for tonight"}</div></div>`;
    const t = list.filter(i => i.date===tdy);
    h += `<h2>Today</h2>` + (t.length ? t.map(card).join("") : `<div class="empty">Nothing planned – enjoy it.</div>`);
    const nx = list.filter(i => i.date>tdy).slice(0,3);
    if(nx.length) h += `<h2>Coming up</h2>` + nx.map(card).join("");
  } else {
    h += `<div class="hero"><div class="big" style="font-size:30px">What a trip 🦘</div><div class="sub">See you next time, Australia.</div></div>`;
  }
  // deadlines
  const dls = [];
  list.forEach(i => { if(i.pay) dls.push([i.pay,"💷 Pay",i]); if(i.cancel) dls.push([i.cancel,"↩️ Free cancel ends",i]); if(i.amend) dls.push([i.amend,"✏️ Free changes end",i]); });
  const tdISO = now.toISOString().slice(0,10);
  const up = dls.filter(d => d[0] >= tdISO).sort((a,b)=>a[0].localeCompare(b[0])).slice(0,4);
  h += `<h2>⏰ Deadlines</h2>` + (up.length ? up.map(([d,l,i]) => { const n = Math.ceil((new Date(d)-now)/864e5);
      return `<div class="card dl"><div><div class="t">${l}: ${esc(i.title)}</div><div class="meta">${fmtDay(d)}</div></div><div class="st"><b>${n}d</b></div></div>`;}).join("")
    : `<div class="card meta">No payment or cancellation dates added yet.</div>`);
  // still to sort
  const c = s => list.filter(i => i.status===s).length;
  h += `<h2>Still to sort</h2><div class="stat">
    <div class="card" onclick="go('todo')"><div class="n">${c("details")}</div><div class="l">❓ need details</div></div>
    <div class="card" onclick="go('todo')"><div class="n">${c("tobook")}</div><div class="l">⚠️ to book</div></div>
    <div class="card" onclick="go('todo')"><div class="n">${c("idea")}</div><div class="l">💡 ideas</div></div></div>`;
  return h;
}

function timeline(){
  const list = items();
  if(!list.length) return `<div class="empty">Nothing tagged for ${TRIP.people[who]} yet.</div>`;
  let h = `<div class="legend"><span>✅ booked</span><span>❓ need details</span><span>⚠️ to book</span><span>💡 idea</span></div>`, cur = "";
  list.forEach(i => {
    if(i.date !== cur){ cur = i.date; h += `<div class="day">${fmtDay(cur)}<small>${gmt(i.tz)}</small></div>`; }
    h += card(i);
  });
  return h + `<p class="meta" style="text-align:center;margin-top:20px">Tap any card for details, map + calendar.<br>All times are local, with the offset from UK time.</p>`;
}

function todo(){
  const list = items();
  const g = (s, t) => { const x = list.filter(i => i.status===s); return x.length ? `<h2>${t} · ${x.length}</h2>` + x.map(card).join("") : ""; };
  return g("details","❓ Booked – Ryan needs details") + g("tobook","⚠️ Still to book") + g("idea","💡 Ideas") || `<div class="empty">All sorted 🎉</div>`;
}

// ---------- costs (encrypted with family code) ----------
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(code){
  const enc = new TextEncoder();
  const key0 = await crypto.subtle.importKey("raw", enc.encode(code.trim().toLowerCase()), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(COSTS_BLOB.salt), iterations:COSTS_BLOB.iter, hash:"SHA-256"}, key0, {name:"AES-GCM",length:256}, false, ["decrypt"]);
  const out = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(COSTS_BLOB.iv)}, key, b64(COSTS_BLOB.data));
  return JSON.parse(new TextDecoder().decode(out));
}
let COSTS = null;
let hideAmts = ls.get("hideAmts") === "1";
async function costs(){
  if(!COSTS) return `<div class="card" style="margin-top:20px"><div class="t">🔒 Family only</div>
    <p class="meta">Enter the family code once – this phone will remember it.</p>
    <form onsubmit="unlock(event)"><input id="code" type="password" autocomplete="off" placeholder="Family code"><div class="row"><button class="btn primary" style="width:100%;justify-content:center;padding:11px">Unlock</button></div></form>
    <p class="meta" id="err"></p></div>`;
  const gbp = n => hideAmts ? "£ ••••" : "£" + n.toLocaleString("en-GB");
  let total = 0, tbcAll = 0;
  const rows = Object.entries(COSTS).map(([cat, lines]) => {
    const sum = lines.reduce((s,l) => s + (l.gbp||0), 0), tbc = lines.filter(l => l.gbp==null).length;
    total += sum; tbcAll += tbc;
    return `<div class="card" onclick="this.classList.toggle('open')"><div class="cost-head"><span>${cat}</span><span class="amt">${!lines.length ? "–" : (sum===0 && tbc ? "TBC" : gbp(sum))}</span></div>
      <div class="meta">${!lines.length ? "Nothing yet" : `${lines.length} item${lines.length!==1?"s":""}${tbc?` · ${tbc} TBC`:""} · tap for breakdown`}</div>
      <div class="cost-lines">${lines.map(l => `<div><span>${esc(l.label)}</span><span>${l.gbp==null?"TBC":gbp(l.gbp)}</span></div>`).join("") || "<div><span class='meta'>Nothing yet</span></div>"}</div></div>`;
  }).join("");
  return `<div class="hero" style="position:relative"><button onclick="toggleEye()" aria-label="Show or hide amounts" style="position:absolute;top:14px;right:14px;border:0;background:rgba(255,255,255,.25);color:#fff;border-radius:99px;padding:7px 11px;font-size:15px">${hideAmts?"🙈 Show":"👁 Hide"}</button><div class="big">${gbp(total)}</div><div class="sub">known so far${tbcAll?` · ${tbcAll} still TBC`:""}</div></div>${rows}
    <p class="meta" style="text-align:center">All in GBP.</p>`;
}
async function unlock(e){
  e.preventDefault(); const c = $("#code").value;
  try{ COSTS = await decrypt(c); ls.set("famcode", c); render(); }
  catch(err){ $("#err").textContent = "That code didn't work – try again."; }
}

// ---------- shell ----------
const TABS = [["today","☀️","Today"],["timeline","🗓️","Timeline"],["todo","✅","To-do"],["costs","💷","Costs"]];
function go(t){ tab = t; ls.set("tab", t); render(); scrollTo(0,0); }
function pick(w){ who = w; ls.set("who", w); render(); }
function toggleEye(){ hideAmts = !hideAmts; ls.set("hideAmts", hideAmts ? "1" : "0"); render(); }
async function render(){
  $("#chips").innerHTML = [["all","Everyone"], ...Object.entries(TRIP.people)].map(([k,v]) =>
    `<button class="chip ${who===k?"on":""}" onclick="pick('${k}')">${v}</button>`).join("");
  const tabs = TABS.filter(t => t[0] !== "costs" || COSTS || tab === "costs");
  $("#nav").innerHTML = tabs.map(([k,ic,l]) => `<button class="${tab===k?"on":""}" onclick="go('${k}')"><b>${ic}</b>${l}</button>`).join("");
  $("#main").innerHTML = tab==="today" ? today() : tab==="timeline" ? timeline() : tab==="todo" ? todo() : await costs();
}
// Family unlock, two hidden ways: (1) the family link ending #fam=CODE (saved, then wiped from the address bar)
// (2) tap the title 5 times quickly → code box. Guests never see a Costs tab.
let taps = 0, tapT;
document.querySelector("h1").addEventListener("click", () => {
  taps++; clearTimeout(tapT); tapT = setTimeout(() => taps = 0, 1500);
  if(taps >= 5){ taps = 0; go("costs"); }
});
(async () => {
  const m = location.hash.match(/fam=([^&]+)/);
  if(m){ try{ COSTS = await decrypt(decodeURIComponent(m[1])); ls.set("famcode", decodeURIComponent(m[1])); }catch(e){}
    history.replaceState(null, "", location.pathname + location.search); }
  const saved = ls.get("famcode");
  if(!COSTS && saved){ try{ COSTS = await decrypt(saved); }catch(e){} }
  if(tab === "costs" && !COSTS) tab = "today";
  render();
})();
if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
